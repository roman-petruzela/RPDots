# rp-audio — streamy, kterých se přepínání výstupu NIKDY nedotkne.
#
# Jeden vzor na řádek. Porovnává se jako podřetězec (case-insensitive) proti
# application.process.binary, application.name a node.name daného streamu.
#
# Pozn.: nahrávací (capture) streamy se neřeší nikdy — sdílení obrazovky se
# zvukem ve Vesktopu ani zachytávání v OBS tedy tenhle mechanismus neovlivní.
# Proto tu vesktop schválně NENÍ: jeho přehrávání (hlasy na Discordu) se má
# přepínat spolu se vším ostatním.

# OBS — má vlastní volbu monitorovacího zařízení v nastavení
obs

# EasyEffects — jeho výstup patří tam, kam si ho nastavíš v EasyEffects
easyeffects

# rp-audio — streams that output switching will NEVER touch.
#
# One pattern per line. Matched as a case-insensitive substring against
# the stream's application.process.binary, application.name, and node.name.
#
# Note: capture streams are never touched — so screen sharing with audio in
# Vesktop, and capturing in OBS, are unaffected by this mechanism. That's
# why Vesktop is deliberately NOT listed here: its playback (voices on
# Discord) should switch along with everything else.

# OBS — has its own monitoring device setting
obs

# EasyEffects — its output belongs wherever you set it in EasyEffects
easyeffects

# RPRice — jednotný výstup zvuku
#
# restore-target = false  → WirePlumber si NEpamatuje, na kterém zařízení
#   aplikace naposledy hrála. Každý nový stream jde na výchozí výstup.
# follow-default-target = true → už běžící streamy se při změně výchozího
#   výstupu přesunou s ním.
#
# Streamy, které si cíl vyžádají samy (monitoring v OBS apod.), zůstávají
# nedotčené — tohle ovlivňuje jen streamy, které žádný cíl neurčily.

wireplumber.settings = {
  node.stream.restore-target   = false
  linking.follow-default-target = true
}

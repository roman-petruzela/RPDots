# RPRice — unified audio output
#
# restore-target = false  → WirePlumber does NOT remember which device an
#   app last played on. Every new stream goes to the default output.
# follow-default-target = true → already-running streams move along with
#   the default output when it changes.
#
# Streams that request their own target (e.g. OBS monitoring) are left
# untouched — this only affects streams that didn't specify a target.

wireplumber.settings = {
  node.stream.restore-target   = false
  linking.follow-default-target = true
}

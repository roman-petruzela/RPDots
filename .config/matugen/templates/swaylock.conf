ignore-empty-password
show-failed-attempts
screenshots
effect-blur=9x5
effect-vignette=0.5:0.5
fade-in=0.3
clock
timestr=%H:%M
datestr=%A, %d. %m.
font=JetBrainsMono Nerd Font
font-size=65

text-color={{colors.on_surface.default.hex_stripped}}ff
text-clear-color={{colors.on_tertiary_container.default.hex_stripped}}ff
text-wrong-color={{colors.on_error_container.default.hex_stripped}}ff
text-caps-lock-color={{colors.on_secondary_container.default.hex_stripped}}ff

indicator
indicator-radius=130
indicator-thickness=6
indicator-caps-lock
indicator-idle-visible

inside-color=00000044
inside-clear-color={{colors.tertiary_container.default.hex_stripped}}33
inside-ver-color={{colors.primary_container.default.hex_stripped}}44
inside-wrong-color={{colors.error_container.default.hex_stripped}}44
inside-caps-lock-color={{colors.secondary_container.default.hex_stripped}}44

ring-color={{colors.primary.default.hex_stripped}}cc
ring-clear-color={{colors.tertiary.default.hex_stripped}}cc
ring-ver-color={{colors.secondary.default.hex_stripped}}cc
ring-wrong-color={{colors.error.default.hex_stripped}}cc
ring-caps-lock-color={{colors.secondary.default.hex_stripped}}cc

line-color=00000000
line-clear-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
separator-color=00000000

bs-hl-color={{colors.error.default.hex_stripped}}
key-hl-color={{colors.primary.default.hex_stripped}}
caps-lock-bs-hl-color={{colors.error.default.hex_stripped}}
caps-lock-key-hl-color={{colors.secondary.default.hex_stripped}}

[general]
bars = 12

[input]
method = pulse
source = auto

[output]
method = raw
data_format = ascii
ascii_max_range = 7
channels = mono
sample_rate = 44100
samples = 512
framerate = 60

[color]
gradient = 1
gradient_color_1 = '{{colors.primary_container.default.hex}}'
gradient_color_2 = '{{colors.primary.default.hex}}'
gradient_color_3 = '{{colors.on_primary_container.default.hex}}'

[smoothing]
noise_reduction = 0.3
waves = 0
gravity = 0.5
integral = 0.8
derivative = 0.4
monstercat = 1

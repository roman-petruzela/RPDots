; Stejné povrchy jako spicetify-user.css, jen bez mřížky (hex_stripped).
; Tenhle soubor jede přes spicetify `replace_colors` a přebarvuje Spotify vlastní
; CSS; user.css nastavuje proměnné. Musí držet stejné hodnoty, jinak se to bije.
[wal]
text                = {{colors.on_surface.dark.hex_stripped}}
subtext             = {{colors.on_surface_variant.dark.hex_stripped}}
main                = {{ colors.primary_container.dark.hex_stripped | to_color | set_lightness: 18 | set_saturation: 30 }}
main-elevated       = {{ colors.primary_container.dark.hex_stripped | to_color | set_lightness: 28 | set_saturation: 29 }}
sidebar             = {{ colors.primary_container.dark.hex_stripped | to_color | set_lightness: 28 | set_saturation: 29 }}
player              = {{ colors.primary_container.dark.hex_stripped | to_color | set_lightness: 21 | set_saturation: 29 }}
card                = {{ colors.primary_container.dark.hex_stripped | to_color | set_lightness: 30 | set_saturation: 27 }}
shadow              = 000000
selected-row        = {{ colors.primary_container.dark.hex_stripped | to_color | set_lightness: 43 | set_saturation: 33 }}
button              = {{colors.primary.dark.hex_stripped}}
button-active       = {{colors.tertiary.dark.hex_stripped}}
button-disabled     = {{colors.outline.dark.hex_stripped}}
tab-active          = {{colors.secondary.dark.hex_stripped}}
notification        = {{colors.primary.dark.hex_stripped}}
notification-error  = {{colors.error.dark.hex_stripped}}
misc                = {{colors.primary.dark.hex_stripped}}

sort=-time
layer=overlay
font=JetBrainsMono Nerd Font 11
border-size=1
border-radius=14
padding=14,18
width=380
height=200
# outer-margin places the list on screen, margin only spaces the bubbles apart
# (mako's margin is inside its surface — see the niri config for why it matters).
outer-margin=12,10,0,0
margin=0,0,8,0
max-icon-size=40
icon-location=left
background-color={{colors.surface_container_high.default.hex}}ee
text-color={{colors.on_surface.default.hex}}ff
border-color={{colors.on_surface.default.hex}}1f
progress-color=over {{colors.primary.default.hex}}55
format=<b>%s</b>\n%b
# anchor, default-timeout a max-visible dodává okno Settings (rp-settings).
# Musí existovat, jinak mako config odmítne — vytváří ho start-rice-services.sh
# i theme-modules/40-mako.sh. Až za globálními volbami, před sekcemi [..].
include=~/.config/mako/rp-settings

[urgency=low]
border-color={{colors.outline_variant.default.hex}}66
default-timeout=4000

[urgency=normal]
border-color={{colors.on_surface.default.hex}}24

[urgency=high]
background-color={{colors.error_container.default.hex}}ee
border-color={{colors.error.default.hex}}cc
text-color={{colors.on_error_container.default.hex}}ff
default-timeout=0

# Nerušit: rp-settings přepíná `makoctl mode -a/-r do-not-disturb`
[mode=do-not-disturb]
invisible=1

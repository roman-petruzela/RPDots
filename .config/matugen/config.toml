[config]
reload_apps = false
set_wallpaper = false

[config.custom_colors]
accent2 = { color = "#5f8a6e", blend = false }

[templates.quickshell-colors]
input_path = "~/.config/matugen/templates/quickshell-colors.js"
output_path = "~/.config/quickshell/Colors.js"

[templates.kitty-theme]
input_path = "~/.config/matugen/templates/kitty-theme.conf"
output_path = "~/.config/kitty/current-theme.conf"

[templates.gtk-colors]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.gtk3-theme-light]
input_path = "~/.config/matugen/templates/gtk3-light.css"
output_path = "~/.local/share/themes/RPRice/gtk-3.0/gtk.css"

[templates.gtk3-theme-dark]
input_path = "~/.config/matugen/templates/gtk3-dark.css"
output_path = "~/.local/share/themes/RPRice/gtk-3.0/gtk-dark.css"

[templates.zed-theme]
input_path = "~/.config/matugen/templates/zed-theme.json"
output_path = "~/.config/zed/themes/rprice.json"

[templates.vesktop-quickcss]
input_path = "~/.config/matugen/templates/vesktop-quickcss.css"
output_path = "~/.config/vesktop/settings/quickCss.generated.css"

[templates.spicetify-colors]
input_path = "~/.config/matugen/templates/spicetify-colors.ini"
output_path = "~/.config/spicetify/Themes/PywalDynamic/color.ini"

[templates.spicetify-user-css]
input_path = "~/.config/matugen/templates/spicetify-user.css"
output_path = "~/.config/spicetify/Themes/PywalDynamic/user.css"

[templates.qt5ct-colors]
input_path = "~/.config/matugen/templates/qt5ct-colors.conf"
output_path = "~/.config/qt5ct/colors/RPRice.conf"

[templates.qt6ct-colors]
input_path = "~/.config/matugen/templates/qt5ct-colors.conf"
output_path = "~/.config/qt6ct/colors/RPRice.conf"

[templates.swaylock]
input_path = "~/.config/matugen/templates/swaylock.conf"
output_path = "~/.config/swaylock/config"

[templates.btop-theme]
input_path = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/rprice.theme"

[templates.cava]
input_path = "~/.config/matugen/templates/cava.conf"
output_path = "~/.config/cava/config"

[templates.fuzzel]
input_path = "~/.config/matugen/templates/fuzzel.ini"
output_path = "~/.config/fuzzel/fuzzel.ini"

[templates.nvim-colors]
input_path = "~/.config/matugen/templates/nvim-colors.lua"
output_path = "~/.config/nvim/lua/matugen_colors.lua"

[templates.yazi-theme]
input_path = "~/.config/matugen/templates/yazi-theme.toml"
output_path = "~/.config/yazi/theme.toml"

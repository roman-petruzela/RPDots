[config]
reload_apps = false
set_wallpaper = false
run_after = [
    "~/.local/bin/matugen-fuzzel.py 2>/dev/null || true",
    "makoctl reload 2>/dev/null || true",
    "pkill -SIGUSR2 waybar 2>/dev/null || true",
    "qs ipc call shell reload 2>/dev/null || true",
]

[config.custom_colors]

[templates.waybar-colors]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"

[templates.quickshell-colors]
input_path = "~/.config/matugen/templates/quickshell-colors.js"
output_path = "~/.config/quickshell/Colors.js"

[templates.mako-colors]
input_path = "~/.config/matugen/templates/mako.ini"
output_path = "~/.config/mako/config"


[templates.kitty-theme]
input_path = "~/.config/matugen/templates/kitty-theme.conf"
output_path = "~/.config/kitty/current-theme.conf"

[templates.gtk-colors]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/colors.css"

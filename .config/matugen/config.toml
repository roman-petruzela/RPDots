[config]
reload_apps = false
set_wallpaper = false
run_after = [
    "~/.local/bin/matugen-fuzzel.py 2>/dev/null || true",
    "makoctl reload 2>/dev/null || true",
    "pkill -SIGUSR2 waybar 2>/dev/null || true",
    "qs ipc call shell reload 2>/dev/null || true",
    "~/.local/bin/kitty-theme-postprocess.sh 2>/dev/null || true",
    "~/.local/bin/theme-modules/10-kitty.sh 2>/dev/null || true",
    "~/.local/bin/ghostty-colors-postprocess.sh 2>/dev/null || true",
    "gdbus call --session --dest com.mitchellh.ghostty --object-path /com/mitchellh/ghostty --method org.gtk.Actions.Activate reload-config '[]' '{\"timestamp\": <uint32 0>}' 2>/dev/null || true",
    "pkill -SIGUSR1 cava 2>/dev/null || true",
]

[config.custom_colors]

[templates.waybar-colors]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"

[templates.quickshell-colors]
input_path = "~/.config/matugen/templates/quickshell-colors.js"
output_path = "~/.config/quickshell/Colors.js"

[templates.mako-colors]
input_path = "~/.config/matugen/templates/mako.ini"
output_path = "~/.config/mako/config"


[templates.kitty-theme]
input_path = "~/.config/matugen/templates/kitty-theme.conf"
output_path = "~/.config/kitty/current-theme.conf"

[templates.gtk-colors]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.zed-theme]
input_path = "~/.config/matugen/templates/zed-theme.json"
output_path = "~/.config/zed/themes/rprice.json"

[templates.vesktop-quickcss]
input_path = "~/.config/matugen/templates/vesktop-quickcss.css"
output_path = "~/.config/vesktop/settings/quickCss.css"

[templates.spicetify-colors]
input_path = "~/.config/matugen/templates/spicetify-colors.ini"
output_path = "~/.config/spicetify/Themes/PywalDynamic/color.ini"

[templates.spicetify-user-css]
input_path = "~/.config/matugen/templates/spicetify-user.css"
output_path = "~/.config/spicetify/Themes/PywalDynamic/user.css"

[templates.qt5ct-colors]
input_path = "~/.config/matugen/templates/qt5ct-colors.conf"
output_path = "~/.config/qt5ct/colors/RPRice.conf"

[templates.qt6ct-colors]
input_path = "~/.config/matugen/templates/qt5ct-colors.conf"
output_path = "~/.config/qt6ct/colors/RPRice.conf"

[templates.ghostty-colors]
input_path = "~/.config/matugen/templates/ghostty-colors.conf"
output_path = "~/.config/ghostty/colors.conf"

[templates.swaylock]
input_path = "~/.config/matugen/templates/swaylock.conf"
output_path = "~/.config/swaylock/config"

[templates.btop-theme]
input_path = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/rprice.theme"

[templates.cava]
input_path = "~/.config/matugen/templates/cava.conf"
output_path = "~/.config/cava/config"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi.rasi"
output_path = "~/.config/rofi/pywal-dynamic.rasi"

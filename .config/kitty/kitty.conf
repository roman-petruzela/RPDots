font_family JetBrainsMono Nerd Font
font_size 11.5

background_opacity 0.85
dynamic_background_opacity yes
confirm_os_window_close 0

window_padding_width 10

cursor_shape block
cursor_blink_interval 0.5
cursor_trail 1
cursor_trail_decay 0.1 0.4

foreground #d7f5ff
background #090c12
selection_foreground #090c12
selection_background #17d4ff
cursor #17d4ff
cursor_text_color #090c12

color0  #101722
color1  #ff5e95
color2  #8dff9a
color3  #ffbf69
color4  #17d4ff
color5  #d08dff
color6  #7be9ff
color7  #d7f5ff
color8  #4f6b7c
color9  #ff7bad
color10 #a8ffb1
color11 #ffd08f
color12 #5fe6ff
color13 #dfadff
color14 #a6f2ff
color15 #f4fbff

enable_audio_bell no
shell_integration enabled
allow_remote_control yes
listen_on unix:/tmp/kitty-remote

# zsh keybinding sequences for Shift/Ctrl+Shift arrows
map shift+left send_text all \x1b[1;2D
map shift+right send_text all \x1b[1;2C
map ctrl+shift+left send_text all \x1b[1;6D
map ctrl+shift+right send_text all \x1b[1;6C

include ~/.config/kitty/current-theme.conf
